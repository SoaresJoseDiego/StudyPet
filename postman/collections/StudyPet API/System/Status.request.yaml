$kind: http-request
method: GET
url: '{{baseUrl}}/api/system/status'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200 e healthy', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().status).to.eql('healthy');
      });

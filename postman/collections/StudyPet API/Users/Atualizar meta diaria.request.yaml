$kind: http-request
name: 'Atualizar meta diária'
method: PUT
url: '{{baseUrl}}/api/users/:userId/daily-goal'
order: 3000
pathVariables:
  - key: userId
    value: '{{userId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "minutes": 30
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200 e meta atualizada', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().dailyGoalMinutes).to.eql(30);
      });

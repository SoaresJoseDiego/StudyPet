$kind: http-request
method: GET
url: '{{baseUrl}}/api/users/:userId/dashboard'
order: 4000
pathVariables:
  - key: userId
    value: '{{userId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200 com resumo do dia', () => {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.today).to.include.keys('focusMinutes', 'goalMinutes', 'goalReached');
      });

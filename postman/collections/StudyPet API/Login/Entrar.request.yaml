$kind: http-request
method: POST
url: '{{baseUrl}}/api/users/sign-in'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{userEmail}}",
      "password": "senha-de-teste-123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200 com o usuário e o token', () => {
        pm.response.to.have.status(200);
        pm.expect(String(pm.response.json().id)).to.eql(String(pm.collectionVariables.get('userId')));
        pm.expect(pm.response.json().token).to.be.a('string');
      });
      if (pm.response.code === 200) {
        pm.collectionVariables.set('authToken', pm.response.json().token);
      }

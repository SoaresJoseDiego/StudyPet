$kind: http-request
description: 'Tenta ler a página pública. Se a Udemy bloquear, usa o título do próprio link (fromPage false).'
method: POST
url: '{{baseUrl}}/api/udemy/preview'
order: 500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "url": "https://www.udemy.com/course/the-complete-web-development-bootcamp/"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200 com título", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().title).to.be.a("string").and.not.empty;
      });

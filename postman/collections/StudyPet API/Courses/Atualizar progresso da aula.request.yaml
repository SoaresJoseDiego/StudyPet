$kind: http-request
method: PUT
url: '{{baseUrl}}/api/users/:userId/courses/:courseId/modules/:moduleId/lessons/:lessonId/progress'
order: 6000
pathVariables:
  - key: userId
    value: '{{userId}}'
  - key: courseId
    value: '{{courseId}}'
  - key: moduleId
    value: '{{moduleId}}'
  - key: lessonId
    value: '{{lessonId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "progress": "InProgress"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
